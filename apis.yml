name: OpenSponsorship
description: >-
  OpenSponsorship is a two-sided sports sponsorship and influencer marketing marketplace
  that connects brands with a network of more than 25,000 professional athletes, teams,
  sports creators, and health and wellness influencers across 150+ sports. Brands pay a
  monthly subscription to search the roster, post campaigns, submit proposals, manage
  contracts, and track ROI, while athletes and their agents join for free with
  OpenSponsorship taking a commission on secured deals. The platform layers AI-based
  matching, social-content search, campaign management, and reporting on top of a managed
  service that handles matching, outreach, contracts, and reporting. OpenSponsorship
  exposes no public developer API at this time; this profile captures its public identity
  and web properties for the API Evangelist network.
